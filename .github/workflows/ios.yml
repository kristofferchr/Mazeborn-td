name: iOS TestFlight

# Builds, signs and uploads to TestFlight on a GitHub-hosted macOS runner
# (free for public repositories). Signing is automatic via an App Store
# Connect API key; no Mac or local certificates are needed. After the upload
# the job sets "What to Test" from the git history and waits until Apple has
# processed the build; it fails if Apple rejects it or it is not processed.
#
#   git tag v0.2.0 && git push --tags   -> version 0.2.0 in TestFlight
#   Actions -> iOS TestFlight -> Run    -> version from game/export_presets.cfg
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   ASC_KEY_ID       Key ID of the App Store Connect API key
#   ASC_ISSUER_ID    Issuer ID (Users and Access -> Integrations)
#   ASC_PRIVATE_KEY_BASE64  base64 of the AuthKey_XXXX.p8 file (base64 -i AuthKey_XXXX.p8)
# The key needs the Admin role (creating certificates/profiles for automatic
# signing requires it).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # scripts/asc_whats_new.py looks up the previous successful run

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags for "What to Test"

      - name: Version and build number
        # Build numbers must increase for every upload; offset leaves room for
        # earlier manual or Xcode Cloud uploads. The marketing version comes
        # from the tag (v0.2.0 -> 0.2.0), else from game/export_presets.cfg.
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^application\/short_version="\(.*\)"$/\1/p' game/export_presets.cfg)"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::'$version' is not a valid iOS version (tag v1, v1.2 or v1.2.3)"
            exit 1
          fi
          build="$((GITHUB_RUN_NUMBER + 100))"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILD=$build" >> "$GITHUB_ENV"
          echo "Mazeborn TD $version (build $build)" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install App Store Connect script dependencies
        run: pip install pyjwt cryptography

      - name: Cache Godot and export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mazeborn/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version') }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Export Godot project to Xcode
        run: scripts/export-ios.sh "$APP_BUILD"

      - name: Write App Store Connect API key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for v in ASC_PRIVATE_KEY_BASE64 ASC_KEY_ID ASC_ISSUER_ID; do
            test -n "${!v}" || { echo "::error::Secret $v is not set"; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::ASC_PRIVATE_KEY_BASE64 is not a base64-encoded .p8 key"; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Godot sets CODE_SIGN_IDENTITY="Apple Distribution" for Release, which
        # conflicts with automatic signing; archive with the development
        # identity and let the export re-sign for App Store distribution.
        # MARKETING_VERSION feeds CFBundleShortVersionString in Info.plist, so
        # the committed ios/ project and export_presets.cfg stay unchanged.
        run: |
          xcodebuild \
            -project ios/Mazeborn.xcodeproj \
            -scheme Mazeborn \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mazeborn.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_IDENTITY="Apple Development" \
            MARKETING_VERSION="$APP_VERSION" \
            archive

      - name: Check version in archive
        run: |
          apps=("$RUNNER_TEMP"/Mazeborn.xcarchive/Products/Applications/*.app)
          plist="${apps[0]}/Info.plist"
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
          number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          echo "archive: $short ($number)"
          if [[ "$short" != "$APP_VERSION" || "$number" != "$APP_BUILD" ]]; then
            echo "::error::archive is $short ($number), expected $APP_VERSION ($APP_BUILD)"
            exit 1
          fi

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mazeborn.xcarchive" \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Set "What to Test"
        # Runs as soon as the build shows up in App Store Connect, so the
        # text is there before Apple notifies the testers.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/asc_whats_new.py --build "$APP_BUILD" --version "$APP_VERSION" --timeout 30

      - name: Wait for Apple to process the build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: python scripts/asc_builds.py --wait "$APP_BUILD" --version "$APP_VERSION" --timeout 45

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-logs
          path: |
            ~/Library/Logs/DiagnosticReports/
            ${{ runner.temp }}/export/*.log
          if-no-files-found: ignore
