name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gdtoolkit)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.5.0"
      - run: gdlint game
      - run: gdformat --check game

  godot:
    name: Test, export and screenshot
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mazeborn/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version') }}

      - name: Install xvfb and Mesa
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri

      - name: Tests
        run: scripts/test.sh

      - name: Web export
        run: scripts/export-web.sh build/web

      - name: iOS export is in sync with committed Xcode project
        run: |
          scripts/export-ios.sh 1
          if ! git diff --exit-code --stat -- ios/; then
            echo "::error::ios/ is out of date. Run scripts/export-ios.sh and commit the changes."
            exit 1
          fi

      - name: Screenshot
        run: scripts/screenshot.sh build/screenshot.png res://main.tscn 60 2532x1170

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: build/screenshot.png

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  # Playable web build on GitHub Pages (branch gh-pages):
  #   main      -> https://kristofferchr.github.io/Mazeborn-td/
  #   PR #N     -> https://kristofferchr.github.io/Mazeborn-td/pr-preview/pr-N/
  pages:
    name: Publish web build
    needs: [lint, godot]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed' && needs.godot.result == 'success'
        with:
          name: web
          path: build/web

      - name: Deploy main
        if: github.event_name == 'push' && needs.godot.result == 'success'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      - name: Deploy or remove PR preview
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.action == 'closed' || needs.godot.result == 'success')
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: build/web
          preview-branch: gh-pages
          umbrella-dir: pr-preview
